<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publicar vacante | Cúcuta Empleos</title><link rel="stylesheet" href="dashboard.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="publicar.js"></script></head><body><main class="main"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">CE</span>CÚCUTA EMPLEOS</a><a class="primary-btn" href="dashboard.html">Mi panel</a></header><div class="section-intro"><div><h2>Publicar una vacante</h2><p>Completa la información para encontrar el talento que tu empresa necesita.</p></div></div><div class="panel"><form id="jobForm" class="form-grid"><label>Título del cargo *<input name="title" required></label><label>Nombre de la empresa *<input name="company_name" required></label><label>Ciudad *<input name="city" value="Cúcuta" required></label><label>Área *<input name="area" required></label><label>Tipo de contrato<input name="contract_type"></label><label>Modalidad<input name="work_mode" value="Presencial"></label><label class="full">Descripción y requisitos *<textarea name="description" rows="6" required></textarea></label><label>Salario<input name="salary"></label><label>Correo de contacto<input name="contact_email" type="email"></label><button class="primary-btn full" type="submit">Publicar vacante</button><p id="msg" class="muted full"></p></form></div></main></body></html>
